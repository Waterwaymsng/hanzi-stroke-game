<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>汉字笔顺练习</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#1f2937;--muted:#6b7280;--accent:#2563eb;--danger:#d9534f;--border:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;padding:24px;text-align:center;font-family:"Microsoft YaHei", system-ui, Segoe UI, Roboto, Arial, sans-serif;background:var(--bg);color:var(--text);}
.wrap{max-width:900px;margin:0 auto;}
.title{font-size:24px;margin:6px 0 18px;font-weight:700;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(17,24,39,0.06);text-align:left;margin:14px 0;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.row.center{justify-content:center;}
.label{font-size:14px;color:var(--muted);margin:0 0 10px;}
textarea{width:100%;height:72px;font-size:18px;padding:12px;border:1px solid var(--border);border-radius:12px;outline:none;resize:vertical;}
input[type="text"],input[type="number"]{width:100%;font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;outline:none;background:#f9fafb;}
button{font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:#fff;cursor:pointer;}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
button.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
button:disabled{opacity:.55;cursor:not-allowed;}
.hidden{display:none;}
#timer{font-size:18px;font-weight:700;color:var(--danger);margin:0 0 6px;text-align:center;}
#currentCharLine{font-size:26px;font-weight:800;text-align:center;margin:0 0 10px;}
#charStage{
  width:260px;
  height:260px;
  margin:10px auto 8px;
  position:relative;
  border-radius:12px;
  background:#fff;
  border:2px solid rgba(17,24,39,.45);
  overflow:hidden;
}
#charStage::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(to right, transparent calc(50% - 1px), rgba(17,24,39,.2) calc(50% - 1px), rgba(17,24,39,.2) calc(50% + 1px), transparent calc(50% + 1px)),
    linear-gradient(to bottom, transparent calc(50% - 1px), rgba(17,24,39,.2) calc(50% - 1px), rgba(17,24,39,.2) calc(50% + 1px), transparent calc(50% + 1px));
}
#charBox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.resultBox{text-align:center;padding:18px;border:1px dashed var(--border);border-radius:14px;background:#fafafa;}
</style>
</head>
<body>
<div class="wrap">
  <!-- 教师 -->
  <div id="teacherPanel">
    <div class="title">汉字笔顺练习（教师控制台）</div>
    <div class="card">
      <div class="label">输入汉字（用顿号或逗号分开）</div>
      <textarea id="charInput">一、二，五,口，人</textarea>
      <div class="label" style="margin-top:12px;">请输入游戏时间（分钟）</div>
      <input id="timeInput" type="number" min="1" max="60" value="1">
      <div class="row left" style="margin-top:12px;">
        <button class="primary" onclick="generateURL()">产生 URL</button>
        <button onclick="generateQR()">产生 QR Code</button>
      </div>
    </div>
    <div class="card" id="shareCard">
      <div class="label">学生游戏 URL</div>
      <input id="urlBox" type="text" readonly placeholder="按「产生 URL」后会显示在这里">
      <div id="qrcode" style="margin-top:10px;"></div>
    </div>
  </div>

  <!-- 学生 -->
  <div id="studentPanel" class="hidden">
    <div class="title">汉字笔顺挑战</div>
    <div class="card">
      <div class="row center">
        <button class="primary modeBtn" onclick="startMode('learn')">看一看</button>
        <button class="primary modeBtn" onclick="startMode('write')">写一写</button>
        <button class="primary modeBtn" onclick="startMode('easy')">初级</button>
        <button class="primary modeBtn" onclick="startMode('medium')">中级</button>
        <button class="primary modeBtn" onclick="startMode('hard')">高级</button>
      </div>
      <div class="label" style="margin-top:8px;">模式说明</div>
      <div>看一看：展示笔顺<br>写一写：浅灰底字，学生写<br>初级：写错 2 次后提示<br>中级：写错 4 次后提示<br>高级：没有提示</div>
    </div>

    <div class="card hidden" id="gameArea">
      <div id="timer">剩余时间：0:00</div>
      <div id="currentCharLine">当前字：-</div>
      <div id="charStage"><div id="charBox"></div></div>
      <div class="row center" style="margin-top:12px;">
        <button id="playBtn" onclick="play()">播放笔顺</button>
        <button id="nextBtn" class="primary" onclick="nextChar()">下一个</button>
        <button class="danger" onclick="resetToHome()">重置</button>
      </div>
      <div id="progressText" class="label"></div>
      <div id="strokeInfo" class="label"></div>
    </div>

    <div class="card hidden" id="resultCard">
      <div class="resultBox" id="result"></div>
      <div class="row center" style="margin-top:10px;">
        <button class="primary" onclick="restart()">回到选择</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ====== 通用函数 ====== */
function parseChars(text){return text.split(/[、，,]/).map(c=>c.trim()).filter(Boolean);}
function clampInt(n,min,max,fallback){n=parseInt(n,10);if(!Number.isFinite(n))return fallback;return Math.max(min,Math.min(max,n));}
function getBaseURLWithoutQuery(){return window.location.href.split("?")[0];}

/* ====== 教师 URL/QR ====== */
function getTeacherMinutes(){return clampInt(document.getElementById("timeInput").value,1,60,1);}
function getStudentURL(){
  const raw=document.getElementById("charInput").value;
  const chars=parseChars(raw);
  if(chars.length===0){alert("请输入至少一个汉字");return null;}
  const minutes=getTeacherMinutes();
  return getBaseURLWithoutQuery()+"?chars="+encodeURIComponent(chars.join(","))+"&t="+encodeURIComponent(String(minutes));
}
function generateURL(){const url=getStudentURL();if(!url)return;document.getElementById("urlBox").value=url;}
function generateQR(){const url=getStudentURL();if(!url)return;document.getElementById("urlBox").value=url;const qr=document.getElementById("qrcode");qr.innerHTML="";new QRCode(qr,{text:url,width:180,height:180});}

/* ====== 学生端读取 ====== */
const params=new URLSearchParams(window.location.search);
const rawChars=params.get("chars");
let chars=[];let idx=0;let writer=null;
let completedChars=0,GAME_SECONDS=60,timeLeft=60,timerId=null,currentMode=null,modeConfig=null;
let mistakesThisChar=0,strokeMistakes={},lastHintStroke=null,lastHintAt=0;

if(rawChars){
  document.getElementById("teacherPanel").classList.add("hidden");
  document.getElementById("studentPanel").classList.remove("hidden");
  chars=rawChars.split(",").map(s=>s.trim()).filter(Boolean);
  GAME_SECONDS=clampInt(params.get("t"),1,60,1)*60;
  timeLeft=GAME_SECONDS;
  updateTimerText();
}

const difficulty={write:{maxDistance:18,hintAfter:999999},easy:{maxDistance:18,hintAfter:2},medium:{maxDistance:12,hintAfter:4},hard:{maxDistance:8,hintAfter:999999},learn:{maxDistance:18,hintAfter:999999}};

/* ====== UI更新 ====== */
function lockModeButtons(locked){document.querySelectorAll(".modeBtn").forEach(b=>b.disabled=locked);}
function updateCurrentCharUI(){document.getElementById("currentCharLine").innerText=`当前字：${chars[idx]||'-'}`;}
function updateProgressText(){
  const modeName=currentMode==='learn'?'看一看':currentMode==='write'?'写一写':currentMode==='easy'?'初级':currentMode==='medium'?'中级':'高级';
  const extra=(currentMode==='learn'||currentMode==='write')?'':`已成功写对：${completedChars} 个`;
  document.getElementById("progressText").innerText=extra?`项目：${modeName}｜${extra}`:`项目：${modeName}`;
}

/* ====== HanziWriter ====== */
function createWriterForChar(ch){
  document.getElementById("charBox").innerHTML="";
  if(currentMode==='write'){
    return HanziWriter.create("charBox",ch,{width:260,height:260,padding:18,showCharacter:true,characterColor:"#ddd",strokeColor:"#000",outlineColor:"#ddd"});
  }
  return HanziWriter.create("charBox",ch,{width:260,height:260,padding:18,showCharacter:false,showOutline:false});
}
function loadCurrentChar(){
  if(writer){try{writer.cancelQuiz();}catch(e){}}
  mistakesThisChar=0;strokeMistakes={};lastHintStroke=null;lastHintAt=0;
  writer=createWriterForChar(chars[idx]);
  updateCurrentCharUI();updateProgressText();
  document.getElementById("strokeInfo").innerText="";
  if(currentMode==='learn'){writer.showOutline();writer.animateCharacter();return;}
  if(currentMode==='write'){writer.quiz();return;}
  writer.quiz({showHintAfterMisses:false,onStrokeEnd:(i,c,ok)=>{document.getElementById("strokeInfo").innerText=ok?`✔ 第 ${i+1} 笔正确`:"❌ 笔顺或位置不对";},customStrokeValidator:(student,correct)=>{if(!student)return true;const maxD=modeConfig.maxDistance;for(let i=0;i<student.length;i++){const d=Math.hypot(student[i][0]-correct[i][0],student[i][1]-correct[i][1]);if(d>maxD)return false;}return true;},onMistake:(strokeData)=>{mistakesThisChar++;const n=strokeData.strokeNum;strokeMistakes[n]=(strokeMistakes[n]||0)+1;if(strokeMistakes[n]>=modeConfig.hintAfter){writer.highlightStroke(n,{strokeColor:"#93c5fd",outlineColor:"#93c5fd"});}},onComplete:()=>{completedChars++;updateProgressText();try{writer.showCharacter();}catch(e){}setTimeout(()=>{idx=(idx+1)%chars.length;loadCurrentChar();},1000);}});
}

function play(){if(writer)writer.animateCharacter();}
function nextChar(){idx=(idx+1)%chars.length;loadCurrentChar();}
function startMode(mode){currentMode=mode;modeConfig=difficulty[mode];idx=0;completedChars=0;if(currentMode!=='easy'&&currentMode!=='medium'&&currentMode!=='hard')timeLeft=GAME_SECONDS;updateTimerText();applyModeUI();lockModeButtons(true);document.getElementById("resultCard").classList.add("hidden");document.getElementById("gameArea").classList.remove("hidden");loadCurrentChar();if(currentMode==='easy'||currentMode==='medium'||currentMode==='hard')startTimer();}
function applyModeUI(){const t=document.getElementById("timer"),p=document.getElementById("playBtn"),n=document.getElementById("nextBtn");if(currentMode==='learn'||currentMode==='write'){t.classList.add("hidden");p.classList.remove("hidden");n.classList.remove("hidden");}else{t.classList.remove("hidden");p.classList.add("hidden");n.classList.add("hidden");}}
function startTimer(){if(timerId)clearInterval(timerId);timerId=setInterval(()=>{timeLeft--;updateTimerText();if(timeLeft<=0)endGame();},1000);}
function updateTimerText(){const m=Math.floor(timeLeft/60),s=String(timeLeft%60).padStart(2,"0");document.getElementById("timer").innerText=`剩余时间：${m}:${s}`;}
function endGame(){if(timerId)clearInterval(timerId);timerId=null;if(writer){try{writer.cancelQuiz();}catch(e){}}document.getElementById("gameArea").classList.add("hidden");document.getElementById("resultCard").classList.remove("hidden");document.getElementById("result").innerHTML=`🎉 <h3 style="margin:8px 0;">恭喜你！</h3><p style="margin:0;font-size:16px;">你已经成功写了 <strong style="font-size:20px;">${completedChars}</strong> 个字！</p>`;}
function goToStudentHome(){if(timerId)clearInterval(timerId);timerId=null;if(writer){try{writer.cancelQuiz();}catch(e){}}currentMode=null;modeConfig=null;completedChars=0;idx=0;mistakesThisChar=0;strokeMistakes={};lastHintStroke=null;lastHintAt=0;timeLeft=GAME_SECONDS;updateTimerText();document.getElementById("gameArea").classList.add("hidden");document.getElementById("resultCard").classList.add("hidden");lockModeButtons(false);}
function resetToHome(){if(currentMode==='learn'||currentMode==='write'){goToStudentHome();return;}if(window.confirm("你的游戏分数将归零哦！"))goToStudentHome();}
function restart(){if(timerId)clearInterval(timerId);timerId=null;if(writer){try{writer.cancelQuiz();}catch(e){}}lockModeButtons(false);document.getElementById("resultCard").classList.add("hidden");document.getElementById("gameArea").classList.add("hidden");document.getElementById("strokeInfo").innerText="";}
</script>
</body>
</html>
